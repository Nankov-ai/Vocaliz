<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Gerar ícones Vocaliz</title>
  <style>
    body { font-family: sans-serif; background: #0f0f13; color: #e8e8f0; padding: 30px; }
    canvas { display: block; margin: 16px 0; border-radius: 12px; }
    p { margin-bottom: 12px; color: #7a7a9a; }
    .ok { color: #4ff7a0; font-weight: 600; }
  </style>
</head>
<body>
  <h2>Gerar ícones Vocaliz</h2>
  <p id="msg">A gerar...</p>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    function drawIcon(size) {
      canvas.width  = size;
      canvas.height = size;
      ctx.clearRect(0, 0, size, size);

      // Purple background with rounded corners (manual)
      const r = size * 0.20;
      ctx.fillStyle = '#7c6af7';
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // Sound wave arcs (white)
      const cx = size * 0.42;
      const cy = size * 0.50;
      const sp = size * 0.14;

      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'round';

      // Speaker body
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      const bw = size * 0.12, bh = size * 0.22;
      ctx.rect(cx - bw - size * 0.02, cy - bh / 2, bw, bh);
      ctx.fill();

      // Speaker cone
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.02, cy - bh / 2);
      ctx.lineTo(cx + size * 0.14, cy - bh * 0.85);
      ctx.lineTo(cx + size * 0.14, cy + bh * 0.85);
      ctx.lineTo(cx - size * 0.02, cy + bh / 2);
      ctx.closePath();
      ctx.fill();

      // Wave 1
      ctx.lineWidth = size * 0.045;
      ctx.beginPath();
      ctx.arc(cx + size * 0.14, cy, sp * 0.9, -Math.PI * 0.45, Math.PI * 0.45);
      ctx.stroke();

      // Wave 2
      ctx.lineWidth = size * 0.04;
      ctx.beginPath();
      ctx.arc(cx + size * 0.14, cy, sp * 1.65, -Math.PI * 0.4, Math.PI * 0.4);
      ctx.stroke();

      // Wave 3
      ctx.lineWidth = size * 0.035;
      ctx.beginPath();
      ctx.arc(cx + size * 0.14, cy, sp * 2.4, -Math.PI * 0.35, Math.PI * 0.35);
      ctx.stroke();
    }

    function downloadIcon(size, name) {
      return new Promise(resolve => {
        drawIcon(size);
        const a = document.createElement('a');
        a.href     = canvas.toDataURL('image/png');
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(resolve, 600);
      });
    }

    async function run() {
      await downloadIcon(192, 'icon-192.png');
      await downloadIcon(512, 'icon-512.png');
      document.getElementById('msg').innerHTML =
        '<span class="ok">✓ Ícones gerados!</span> Coloca os dois ficheiros PNG na pasta <code>icons/</code> do projeto.';
    }

    run();
  </script>
</body>
</html>
